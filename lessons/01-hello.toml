title = "첫 프로그램과 출력"
summary = "fn main, println! 매크로, 포맷 문자열, 주석"
concept = '''
Rust 프로그램은 `fn main()` 함수에서 실행을 시작합니다. `fn` 은 함수를 정의하는 키워드이고, 중괄호 `{ }` 안에 실행할 코드를 적습니다. 각 문장 끝에는 세미콜론 `;` 을 붙입니다.

화면에 글자를 출력할 때는 `println!` 을 씁니다. 이름 끝의 `!` 는 함수가 아니라 매크로라는 표시입니다. 매크로는 컴파일할 때 코드를 대신 만들어 주는 도구라고 생각하면 됩니다. `println!` 은 끝에 줄바꿈을 붙여 출력하고, `print!` 는 줄바꿈 없이 출력합니다.

출력할 문자열 안의 중괄호는 값이 들어갈 자리(placeholder)입니다.
- `{}` : 문자열 뒤에 쉼표로 넘긴 값을 순서대로 채웁니다.
- `{x}` : 변수 `x` 의 값을 이름으로 바로 채웁니다.
- `{:?}` : 디버그 형식으로 출력합니다. 문자열은 따옴표까지 함께 보입니다.

`//` 뒤의 내용은 줄 끝까지 주석이 되어 컴파일러가 무시합니다. 여러 줄 주석은 `/*` 와 `*/` 로 감쌉니다.

예제의 `let` 은 변수를 만드는 키워드로, 다음 레슨에서 자세히 다룹니다.
'''
example = '''
// 프로그램은 main 함수에서 시작합니다
fn main() {
    println!("Hello, world!");
    println!("{} + {} = {}", 1, 2, 1 + 2);

    let name = "Rust";
    println!("안녕, {name}!");

    /* 디버그 형식은
       문자열의 따옴표까지 보여 줍니다 */
    println!("{:?}", name);
}
'''

[[quiz]]
prompt = "한 줄 주석 기호와 프로그램이 시작되는 함수 이름을 채우세요"
code = '''
___ 프로그램은 여기서 시작합니다
fn ___() {
    println!("Hello, Rust!");
}
'''
answers = ["//", "main"]
hint = "주석은 슬래시 두 개, 시작 함수는 영어로 '주된' 이라는 뜻"
explanation = "`//` 뒤는 줄 끝까지 주석입니다. Rust 실행 파일은 항상 `main` 함수에서 시작합니다."

[[quiz]]
prompt = "줄바꿈까지 붙여 출력하는 매크로를 쓰고, 변수 lang 을 중괄호 안에 이름으로 직접 넣으세요"
code = '''
fn main() {
    let lang = "Rust";
    ___!("안녕, {___}!");
}
'''
answers = ["println", "lang"]
hint = "print + line, 그리고 변수 이름 그대로"
explanation = "`println!` 은 출력 후 줄을 바꿉니다. `{lang}` 처럼 중괄호 안에 변수 이름을 쓰면 그 값이 그 자리에 들어갑니다."

[[quiz]]
prompt = "두 번째 값은 디버그 형식으로 출력해 따옴표까지 보이게 하세요"
code = '''
fn main() {
    println!("{} 와 {___}", "Rust", "Rust");
}
'''
answers = [":?"]
hint = "콜론(:) 다음에 물음표(?)"
explanation = '`{:?}` 는 디버그 형식이라 문자열을 따옴표째 출력합니다. 결과는 `Rust 와 "Rust"` 입니다.'
