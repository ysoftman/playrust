title = "변수와 가변성"
summary = "let, 불변 기본값, mut, shadowing, const"
concept = '''
`let` 으로 변수를 만듭니다. Rust 의 변수는 기본적으로 불변(immutable)이라서 한 번 값을 넣으면 바꿀 수 없습니다. 실수로 값이 바뀌는 버그를 컴파일 단계에서 막아 주기 위한 설계입니다.

값을 바꿔야 한다면 `let mut` 으로 선언합니다. `mut` 는 mutable(가변)의 줄임말입니다. `mut` 없이 `x += 1` 처럼 값을 바꾸려 하면 컴파일 에러가 납니다.

같은 이름으로 `let` 을 다시 쓰면 이전 변수를 가리는 새 변수가 생깁니다. 이를 shadowing 이라고 합니다. 값을 고치는 것이 아니라 매번 새 변수를 만드는 것이라 `mut` 가 필요 없고, 타입을 바꿀 수도 있으며, 새 변수도 여전히 불변입니다.

`const` 는 상수를 선언합니다.
- 항상 불변이며 `mut` 를 붙일 수 없습니다.
- 타입을 반드시 적어야 합니다. 예: `const MAX: u32 = 100;` (`u32` 는 다음 레슨에서 배울 정수 타입)
- 이름은 관례상 대문자와 밑줄로 짓습니다. 예: `MAX_POINTS`
- 함수 밖 전역 범위에도 선언할 수 있습니다.
'''
example = '''
const MAX_POINTS: u32 = 100;

fn main() {
    let x = 5;
    println!("x = {x}");

    let mut count = 0;
    count += 1;
    println!("count = {count}");

    // shadowing: 같은 이름으로 새 변수를 만든다
    let x = x * 2;
    println!("새 x = {x}");

    println!("최대 점수 = {MAX_POINTS}");
}
'''

[[quiz]]
prompt = "score 를 변경 가능한 변수로 선언하세요"
code = '''
fn main() {
    let ___ score = 10;
    score += 5;
    println!("{score}");
}
'''
answers = ["mut"]
hint = "가변(mutable)의 줄임말"
explanation = "Rust 변수는 기본이 불변이라 `score += 5` 처럼 값을 바꾸려면 `let mut` 으로 선언해야 합니다."

[[quiz]]
prompt = "mut 없이 같은 이름 x 를 두 번 다시 선언(shadowing)해서 최종 값이 12 가 되게 하세요"
code = '''
fn main() {
    let x = 5;
    ___ x = x + 1;
    ___ x = x * 2;
    println!("{x}");
}
'''
answers = ["let", "let"]
hint = "변수를 만들 때 쓰는 그 키워드를 다시 씁니다"
explanation = "`let` 을 다시 쓰면 이전 x 를 가리는 새 변수가 생깁니다. 5 → 6 → 12 순서로 새 x 가 만들어집니다."

[[quiz]]
prompt = "BONUS 를 상수로 선언하고, total 은 값을 바꿀 수 있는 변수로 선언하세요"
code = '''
___ BONUS: i32 = 10;

fn main() {
    let ___ total = 0;
    total += BONUS;
    total += BONUS;
    println!("total = {total}");
}
'''
answers = ["const", "mut"]
hint = "constant 의 줄임말, 그리고 mutable 의 줄임말"
explanation = "`const` 는 타입을 반드시 적어야 하는 상수로 함수 밖에도 둘 수 있습니다. total 은 값이 바뀌므로 `mut` 가 필요하고, 최종 값은 20 입니다."
