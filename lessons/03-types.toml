title = "데이터 타입"
summary = "정수, 부동소수, bool, char, 타입 표기, 튜플, 배열"
concept = '''
Rust 는 정적 타입 언어라서 모든 값의 타입이 컴파일 시점에 정해집니다. 대부분은 컴파일러가 추론해 주지만 `let x: i32 = 5;` 처럼 변수 이름 뒤 콜론에 타입을 직접 적을 수도 있습니다.

스칼라(값 하나) 타입
- 정수: 부호 있는 `i8` `i16` `i32` `i64` `i128`, 부호 없는 `u8` ~ `u128`, 그리고 `isize` `usize`. 아무것도 안 적으면 `i32` 입니다.
- 부동소수: `f32`, `f64`. 아무것도 안 적으면 `f64` 입니다.
- 불리언: `bool` 이며 값은 `true` 또는 `false` 입니다.
- 문자: `char` 이며 작은따옴표로 감쌉니다(`'A'`, `'가'`). 큰따옴표는 문자열입니다.

복합 타입
- 튜플: 서로 다른 타입 여러 개를 묶습니다. `let t: (i32, f64) = (1, 2.5);` 처럼 쓰고 `t.0`, `t.1` 로 꺼내거나 `let (a, b) = t;` 로 한 번에 분해합니다.
- 배열: 같은 타입 값을 정해진 개수만큼 담습니다. 타입은 `[i32; 3]` 처럼 원소 타입과 길이로 적고, `arr[0]` 처럼 0 부터 시작하는 인덱스로 접근합니다.

튜플과 배열은 `{}` 로는 출력할 수 없고 `{:?}` 로 출력합니다.
'''
example = '''
fn main() {
    let age: i32 = 30;
    let height: f64 = 1.75;
    let is_student: bool = false;
    let initial: char = 'R';
    println!("{age} {height} {is_student} {initial}");

    let point: (i32, f64) = (3, 2.5);
    let (px, py) = point;
    println!("튜플 {:?} 첫 값 {} 분해 {px} {py}", point, point.0);

    let nums: [i32; 3] = [10, 20, 30];
    println!("배열 {:?} 두 번째 값 {}", nums, nums[1]);
}
'''

[[quiz]]
prompt = "64비트 부동소수, 참/거짓, 문자 한 글자 타입을 차례로 적으세요"
code = '''
fn main() {
    let height: ___ = 1.75;
    let is_ready: ___ = true;
    let grade: ___ = 'A';
    println!("{height} {is_ready} {grade}");
}
'''
answers = ["f64", "bool", "char"]
hint = "float 64비트, boolean, character 의 줄임말"
explanation = "부동소수의 기본 타입은 `f64`, 참/거짓은 `bool`, 작은따옴표로 감싼 한 글자는 `char` 입니다."

[[quiz]]
prompt = "튜플의 첫 번째 값을 x 에, 두 번째 값을 y 에 꺼내세요"
code = '''
fn main() {
    let point = (3, 7);
    let x = point.___;
    let y = point.___;
    println!("x={x}, y={y}");
}
'''
answers = ["0", "1"]
hint = "튜플 인덱스는 0 부터 시작합니다"
explanation = "튜플은 `point.0`, `point.1` 처럼 점 뒤에 0 부터 시작하는 번호를 붙여 값을 꺼냅니다."

[[quiz]]
prompt = "배열 타입에 길이를 적고, 마지막 원소를 인덱스로 꺼내세요"
code = '''
fn main() {
    let scores: [i32; ___] = [90, 85, 77];
    let last = scores[___];
    println!("마지막 점수: {last}");
    println!("{:?}", scores);
}
'''
answers = ["3", "2"]
hint = "원소는 세 개이고, 인덱스는 0 부터 셉니다"
explanation = "배열 타입 `[i32; 3]` 의 길이는 실제 원소 개수와 같아야 합니다. 원소가 3 개이므로 마지막 인덱스는 2 입니다."
