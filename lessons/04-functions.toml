title = "함수"
summary = "매개변수, 반환 타입, 구문과 표현식, 마지막 표현식 반환"
concept = '''
함수는 `fn 이름(매개변수) -> 반환타입 { 본문 }` 형태로 정의합니다. 이름은 관례상 소문자와 밑줄(snake_case)로 짓고, `main` 보다 아래에 정의해도 호출할 수 있습니다.

매개변수는 `x: i32` 처럼 반드시 타입을 적어야 하고, 여러 개면 쉼표로 구분합니다. 값을 돌려주는 함수는 `->` 뒤에 반환 타입을 적습니다. `->` 가 없으면 돌려줄 값이 없는 함수입니다.

Rust 코드는 구문(statement)과 표현식(expression)으로 나뉩니다.
- 구문: 동작만 하고 값을 만들지 않습니다. `let y = 6;` 이 대표적입니다.
- 표현식: 계산해서 값을 만듭니다. `5 + 6`, 함수 호출, 중괄호 블록 `{ }` 모두 표현식입니다.

함수 본문의 마지막 줄을 세미콜론 없이 쓰면 그 표현식의 값이 그대로 반환값이 됩니다. 끝에 세미콜론을 붙이면 구문이 되어 값이 사라지므로, 반환 타입이 있는 함수라면 타입이 맞지 않는다는 컴파일 에러가 납니다.

마지막 줄이 아닌 곳에서 값을 돌려주거나 명시적으로 돌려주고 싶다면 `return 값;` 을 씁니다.
'''
example = '''
fn add(a: i32, b: i32) -> i32 {
    a + b // 세미콜론이 없으므로 이 값이 반환된다
}

fn print_sum(a: i32, b: i32) {
    println!("{a} + {b} = {}", add(a, b));
}

fn main() {
    print_sum(2, 3);

    // 중괄호 블록도 표현식이라 마지막 값이 y 에 들어간다
    let y = {
        let x = 3;
        x + 1
    };
    println!("y = {y}");
}
'''

[[quiz]]
prompt = "double 함수가 i32 값을 반환하도록 반환 타입 앞의 기호를 채우세요"
code = '''
fn double(x: i32) ___ i32 {
    x * 2
}

fn main() {
    let result = double(21);
    println!("{result}");
}
'''
answers = ["->"]
hint = "하이픈(-)과 꺾쇠(>)로 만든 화살표"
explanation = "반환 타입은 `->` 뒤에 적습니다. 마지막 줄 `x * 2` 에 세미콜론이 없으므로 그 값 42 가 반환됩니다."

[[quiz]]
prompt = "height 의 타입을 width 와 같게 채우고, 위에서 정의한 함수를 호출해 넓이를 구하세요"
code = '''
fn area(width: i32, height: ___) -> i32 {
    width * height
}

fn main() {
    let a = ___(3, 4);
    println!("넓이: {a}");
}
'''
answers = ["i32", "area"]
hint = "32비트 부호 있는 정수, 그리고 함수 이름 그대로"
explanation = "매개변수마다 타입을 적어야 하며, 서로 다른 정수 타입끼리는 곱할 수 없으므로 height 도 `i32` 여야 합니다. `area(3, 4)` 는 12 를 돌려줍니다."

[[quiz]]
prompt = "마지막 줄 끝에 세미콜론이 있어도 값을 돌려주도록 키워드를 채우세요"
code = '''
fn add_one(n: i32) -> i32 {
    ___ n + 1;
}

fn main() {
    let y = {
        let x = add_one(2);
        x * 10
    };
    println!("y = {y}");
}
'''
answers = ["return"]
hint = "돌려준다는 뜻의 영어 키워드"
explanation = "`n + 1;` 처럼 세미콜론이 붙으면 구문이라 값이 반환되지 않습니다. `return` 을 쓰면 명시적으로 값을 돌려줄 수 있고, 블록의 마지막 표현식 `x * 10` 은 30 이 되어 y 에 들어갑니다."
