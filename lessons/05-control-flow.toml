title = "제어 흐름"
summary = "if 표현식, loop 와 break 값, while, for 범위 반복"
concept = '''
프로그램은 조건에 따라 다른 일을 하거나 같은 일을 여러 번 반복해야 할 때가 많습니다. Rust 는 이를 위해 `if`, `loop`, `while`, `for` 를 제공합니다.

`if` 의 조건은 반드시 `bool` 이어야 합니다. 조건을 감싸는 괄호는 필요 없지만 중괄호 `{}` 는 꼭 써야 하고, 여러 갈래는 `else if` 로 이어 붙입니다.

Rust 에서 `if` 는 표현식이라서 값을 만들어 냅니다. 그래서 `let kind = if n % 2 == 0 { "짝수" } else { "홀수" };` 처럼 결과를 바로 변수에 담을 수 있습니다. 이때 모든 갈래의 값은 같은 타입이어야 합니다.

반복문은 세 가지입니다.
- `loop`: 멈추라고 할 때까지 계속 반복합니다. `break 값;` 으로 빠져나오면서 값을 돌려줄 수 있습니다.
- `while 조건 { ... }`: 조건이 `true` 인 동안 반복합니다.
- `for 변수 in 범위 { ... }`: 범위나 배열의 원소를 하나씩 꺼내며 반복합니다.

범위 `0..5` 는 0, 1, 2, 3, 4 처럼 끝 값을 포함하지 않고, `1..=3` 은 1, 2, 3 처럼 끝 값을 포함합니다. 반복 횟수가 정해져 있다면 실수할 여지가 적은 `for` 를 가장 많이 씁니다.
'''
example = '''
fn main() {
    let n = 7;
    let kind = if n % 2 == 0 { "짝수" } else { "홀수" };
    println!("{n} 은(는) {kind}");

    let mut count = 0;
    let result = loop {
        count += 1;
        if count == 3 {
            break count * 10; // loop 를 끝내면서 값 30 을 돌려준다
        }
    };
    println!("loop 결과: {result}");

    let mut left = 3;
    while left > 0 {
        println!("카운트다운 {left}");
        left -= 1;
    }

    for i in 0..3 {
        println!("0..3 -> {i}"); // 0, 1, 2
    }
    for i in 1..=3 {
        println!("1..=3 -> {i}"); // 1, 2, 3
    }
}
'''

[[quiz]]
prompt = "if 표현식으로 점수가 60 이상이면 합격, 아니면 불합격을 pass 에 담으세요"
code = '''
fn main() {
    let score = 85;
    let pass = ___ score >= 60 { "합격" } ___ { "불합격" };
    println!("{pass}");
}
'''
answers = ["if", "else"]
hint = "조건이 참일 때와 거짓일 때, 두 갈래를 만드는 키워드 두 개"
explanation = "Rust 의 if 는 표현식이라 값을 돌려주므로 let 의 오른쪽에 바로 쓸 수 있습니다. 두 갈래의 값은 모두 같은 타입(&str)이어야 합니다."

[[quiz]]
prompt = "n 이 50 을 넘을 때까지 무한 반복하다가, 그때의 n 을 result 에 돌려주세요"
code = '''
fn main() {
    let mut n = 1;
    let result = ___ {
        n *= 2;
        if n > 50 {
            ___ n;
        }
    };
    println!("{result}");
}
'''
answers = ["loop", "break"]
hint = "조건 없이 계속 도는 반복문과, 그 반복문을 빠져나오는 키워드"
explanation = "loop 는 break 를 만날 때까지 반복하고, break 뒤에 값을 쓰면 그 값이 loop 표현식의 결과가 됩니다. 1, 2, 4, ... 로 두 배씩 커지다가 64 에서 멈춥니다."

[[quiz]]
prompt = "1 부터 5 까지(5 포함) 모두 더해 15 가 출력되도록 범위를 완성하세요"
code = '''
fn main() {
    let mut sum = 0;
    for i in 1___5 {
        sum += i;
    }
    println!("{sum}");
}
'''
answers = ["..="]
hint = "끝 값을 포함하는 범위 연산자"
explanation = "1..5 는 5 를 포함하지 않아 1+2+3+4 = 10 이 됩니다. 1..=5 처럼 = 를 붙여야 끝 값까지 포함해 15 가 됩니다."
