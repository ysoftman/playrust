title = "슬라이스"
summary = "String 과 &str, 문자열 슬라이스, 배열 슬라이스 &[i32]"
concept = '''
슬라이스(slice)는 컬렉션의 연속된 일부분을 가리키는 참조입니다. 참조이므로 소유권을 가져가지 않습니다.

문자열 슬라이스는 `&s[시작..끝]` 으로 만듭니다. 시작은 포함하고 끝은 포함하지 않으므로 `&s[0..5]` 는 0번부터 4번까지입니다. `&s[..5]` 는 처음부터, `&s[6..]` 은 끝까지, `&s[..]` 는 전체를 뜻합니다. 문자열 슬라이스의 타입은 `&str` 입니다.

`String` 은 문자열 데이터를 소유하며 늘리거나 고칠 수 있습니다. `&str` 은 어딘가에 있는 문자열을 빌려 보는 읽기 전용 뷰입니다. 코드에 직접 쓴 문자열 리터럴 `"hello"` 도 `&str` 입니다. 함수 매개변수를 `&String` 대신 `&str` 로 두면 `&s` (String 의 참조)와 문자열 리터럴을 모두 받을 수 있어 더 유연합니다.

배열도 같은 방법으로 자를 수 있습니다. `let a = [1, 2, 3, 4, 5];` 에서 `&a[1..3]` 은 `[2, 3]` 을 가리키는 `&[i32]` 타입의 슬라이스입니다. 슬라이스는 `for x in 슬라이스` 로 순회할 수 있고 `.len()` 으로 길이를 알 수 있습니다.

주의할 점이 하나 있습니다. 문자열 인덱스는 글자가 아니라 바이트 기준입니다. 한글은 한 글자가 3바이트라서 글자 중간을 자르면 실행 중에 panic 이 발생합니다.
'''
example = '''
fn greet(name: &str) {
    println!("안녕, {name}!");
}

fn sum(nums: &[i32]) -> i32 {
    let mut total = 0;
    for n in nums {
        total += n;
    }
    total
}

fn main() {
    let s = String::from("hello world");
    let hello = &s[0..5]; // 0 ~ 4 번 바이트
    let world = &s[6..]; // 6 번부터 끝까지
    println!("{hello} / {world}");

    greet(&s); // &String 도 &str 매개변수로 넘길 수 있다
    greet("rust"); // 문자열 리터럴은 원래 &str

    let arr = [1, 2, 3, 4, 5];
    let part = &arr[1..4]; // [2, 3, 4]
    println!("부분 합: {}, 길이: {}", sum(part), part.len());
    println!("전체 합: {}", sum(&arr));
}
'''

[[quiz]]
prompt = '"hello world" 에서 hello 와 world 를 각각 잘라내도록 숫자를 채우세요'
code = '''
fn main() {
    let s = String::from("hello world");
    let hello = &s[0..___];
    let world = &s[___..];
    println!("{hello}, {world}");
}
'''
answers = ["5", "6"]
hint = "끝 인덱스는 포함되지 않고, 5 번 바이트는 공백입니다"
explanation = "&s[0..5] 는 0~4 번 바이트인 hello 를, &s[6..] 은 공백 다음인 6 번부터 끝까지 world 를 가리킵니다."

[[quiz]]
prompt = "String 의 참조와 문자열 리터럴을 모두 받을 수 있는 매개변수 타입을 쓰세요"
code = '''
fn shout(s: ___) {
    println!("{s}!");
}

fn main() {
    let owned = String::from("hi");
    shout(&owned);
    shout("hey");
}
'''
answers = ["&str"]
hint = "문자열 리터럴 \"hey\" 와 같은 타입, 즉 문자열 슬라이스 타입"
explanation = "문자열 리터럴은 원래 &str 이고, &String 은 &str 자리에 자동으로 변환되어 넘어갑니다. 그래서 문자열을 읽기만 하는 함수는 &str 을 받는 것이 좋습니다."

[[quiz]]
prompt = "i32 배열 슬라이스를 받아 합을 구하는 함수를 완성하고, arr 의 가운데 두 원소를 빌려 넘기세요"
code = '''
fn sum(nums: ___) -> i32 {
    let mut total = 0;
    for n in nums {
        total += n;
    }
    total
}

fn main() {
    let arr = [10, 20, 30, 40];
    let mid = ___arr[1..3];
    println!("{}", sum(mid));
}
'''
answers = ["&[i32]", "&"]
hint = "i32 슬라이스 타입은 대괄호 안에 원소 타입만 씁니다. 슬라이스도 참조입니다"
explanation = "&arr[1..3] 은 [20, 30] 을 가리키는 &[i32] 슬라이스라서 50 이 출력됩니다. 배열 슬라이스 타입에는 [i32; 4] 와 달리 길이가 들어가지 않습니다."
