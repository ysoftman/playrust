answers = ["struct"]
hint = "구조체를 영어로 쓰면? 정의에 쓰는 키워드입니다"
explanation = "`struct` 키워드로 필드 이름과 타입을 나열해 새 타입을 정의합니다. 만든 인스턴스의 필드는 `p.x` 처럼 점으로 읽습니다."

[[quiz]]
prompt = "Square 에 메서드를 붙이는 블록을 만들고, area 가 인스턴스를 불변으로 빌리도록 첫 매개변수를 쓰세요"
code = '''
struct Square {
    side: u32,
}

___ Square {
    fn area(___) -> u32 {
        self.side * self.side
    }
}

fn main() {
    let sq = Square { side: 5 };
    println!("넓이: {}", sq.area());
}
'''
answers = ["impl", "&self"]
hint = "구현(implementation)의 줄임말 키워드, 그리고 self 앞에 불변 참조 기호"
explanation = "`impl Square { ... }` 안에 정의한 함수 중 첫 매개변수가 `&self` 인 것이 메서드입니다. `sq.area()` 로 호출하면 sq 를 빌려 쓰므로 호출 뒤에도 sq 를 계속 사용할 수 있습니다."

[[quiz]]
prompt = "User 를 {:?} 로 출력할 수 있게 하고, 연관 함수 new 를 호출하는 구분자를 쓰세요"
code = '''
#[derive(___)]
struct User {
    name: String,
    age: u32,
}

impl User {
    fn new(name: &str, age: u32) -> Self {
        Self { name: String::from(name), age }
    }
}

fn main() {
    let user = User___new("철수", 20);
    println!("{:?}", user);
    println!("{} ({}살)", user.name, user.age);
}
'''
answers = ["Debug", "::"]
hint = "디버그(debug) 출력 기능의 이름은 대문자로 시작합니다. 연관 함수 호출 구분자는 콜론 두 개입니다"
explanation = "`#[derive(Debug)]` 를 붙이면 `{:?}` 로 구조체를 출력할 수 있습니다. self 가 없는 연관 함수는 인스턴스가 아니라 타입에 속하므로 `User::new(...)` 처럼 `::` 로 호출합니다."
