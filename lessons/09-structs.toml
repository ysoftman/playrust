title = "구조체"
summary = "struct 정의와 필드, impl 블록, &self 메서드, 연관 함수 new, #[derive(Debug)]"
concept = '''
구조체(struct)는 서로 관련된 값 여러 개를 하나로 묶어 이름을 붙인 사용자 정의 타입입니다. 묶인 각 값을 필드(field)라고 부르며, 필드마다 이름과 타입을 정합니다.

`struct 이름 { 필드: 타입, ... }` 으로 정의하고, `이름 { 필드: 값, ... }` 으로 인스턴스를 만듭니다. 필드는 `rect.width` 처럼 점(.)으로 읽습니다. 필드 값을 바꾸려면 인스턴스 전체를 `let mut` 으로 선언해야 합니다.

`impl 이름 { ... }` 블록 안에는 그 구조체에 딸린 함수를 정의합니다.
- 첫 매개변수가 `&self` 인 함수는 메서드입니다. `rect.area()` 처럼 점으로 호출하며, 인스턴스를 빌려서 읽기만 합니다. 필드를 바꾸는 메서드라면 `&mut self` 를 받습니다.
- `self` 매개변수가 없는 함수는 연관 함수입니다. `Rectangle::new(3, 4)` 처럼 `::` 로 호출하며, 인스턴스를 만들어 돌려주는 `new` 가 대표적입니다.
- `impl` 안의 `Self` 는 대상 타입(여기서는 `Rectangle`)을 가리키는 별칭입니다.
- 변수 이름과 필드 이름이 같으면 `Self { width, height }` 처럼 줄여 쓸 수 있습니다.

구조체는 그대로는 `println!` 으로 출력할 수 없습니다. 정의 바로 위에 `#[derive(Debug)]` 를 붙이면 `{:?}` 로 모든 필드를 디버그 출력할 수 있습니다.
'''
example = '''
#[derive(Debug)]
struct Rectangle {
    width: u32,
    height: u32,
}

impl Rectangle {
    fn new(width: u32, height: u32) -> Self {
        Self { width, height }
    }

    fn area(&self) -> u32 {
        self.width * self.height
    }
}

fn main() {
    let rect = Rectangle::new(3, 4);
    println!("{:?}", rect);
    println!("너비: {}", rect.width);
    println!("넓이: {}", rect.area());
}
'''

