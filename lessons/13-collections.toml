title = "컬렉션: Vec 과 HashMap"
summary = "vec!, push, 인덱스와 get, for 순회, HashMap 의 insert, get, entry().or_insert"
concept = '''
`Vec<T>` (벡터)는 같은 타입의 값 여러 개를 순서대로 담는, 크기가 늘어나는 목록입니다. `vec![1, 2, 3]` 매크로로 값을 넣어 만들거나 `Vec::new()` 로 빈 벡터를 만듭니다.

`push(값)` 은 벡터 끝에 값을 추가합니다. 벡터를 바꾸는 동작이므로 변수를 `let mut` 으로 선언해야 합니다. `len()` 으로 원소 개수를 알 수 있습니다.

원소를 읽는 방법은 두 가지입니다.
- `v[0]` 처럼 인덱스로 읽기: 범위를 벗어나면 프로그램이 panic 으로 멈춥니다.
- `v.get(0)` 으로 읽기: `Option<&T>` 를 돌려주므로 범위 밖이면 `None` 이 되어 안전합니다.

`for x in &v` 처럼 참조로 순회하면 벡터의 소유권을 넘기지 않고 원소를 하나씩 읽을 수 있습니다.

`HashMap<K, V>` 는 키(key)로 값(value)을 찾는 자료구조입니다. `use std::collections::HashMap;` 으로 가져와 씁니다.
- `insert(키, 값)` 으로 넣고, `get(키)` 로 찾으면 `Option<&V>` 를 돌려줍니다. `map[키]` 로도 읽을 수 있지만 키가 없으면 panic 합니다.
- `entry(키).or_insert(기본값)` 은 키가 없을 때만 기본값을 넣고, 그 값의 가변 참조를 돌려줍니다. `*` 로 역참조해 `+= 1` 하면 개수 세기에 편리합니다.

HashMap 은 순서를 보장하지 않으므로, 전체를 순회하면 출력 순서가 실행마다 달라질 수 있습니다.
'''
example = '''
use std::collections::HashMap;

fn main() {
    let mut nums = vec![10, 20, 30];
    nums.push(40);
    println!("첫 번째: {}, 길이: {}", nums[0], nums.len());

    match nums.get(9) {
        Some(n) => println!("9번 인덱스: {n}"),
        None => println!("9번 인덱스는 없습니다"),
    }

    for n in &nums {
        println!("값: {n}");
    }

    let mut ages = HashMap::new();
    ages.insert("철수", 20);
    ages.insert("영희", 22);
    if let Some(age) = ages.get("영희") {
        println!("영희의 나이: {age}");
    }

    let words = vec!["사과", "배", "사과"];
    let mut counts = HashMap::new();
    for w in words {
        let count = counts.entry(w).or_insert(0);
        *count += 1;
    }
    println!("사과: {}, 배: {}", counts["사과"], counts["배"]);
}
'''

