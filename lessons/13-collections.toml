prompt = 'fruits 를 변경 가능하게 선언하고, 끝에 "포도" 를 추가하세요'
code = '''
fn main() {
    let ___ fruits = vec!["사과", "배"];
    fruits.___("포도");
    println!("{:?}, 개수: {}", fruits, fruits.len());
}
'''
answers = ["mut", "push"]
hint = "가변(mutable)을 뜻하는 키워드, 그리고 벡터 끝에 값을 밀어 넣는 메서드"
explanation = '`push` 는 벡터를 바꾸므로 변수가 `let mut` 이어야 합니다. 실행하면 `["사과", "배", "포도"], 개수: 3` 이 출력됩니다.'

[[quiz]]
prompt = "범위를 벗어난 인덱스 5 를 panic 없이 안전하게 읽으세요"
code = '''
fn main() {
    let v = vec![1, 2, 3];
    match v.___(5) {
        ___(n) => println!("값: {n}"),
        None => println!("인덱스 5 에는 값이 없습니다"),
    }
}
'''
answers = ["get", "Some"]
hint = "Option 을 돌려주는 읽기 메서드, 그리고 값이 있을 때의 Option variant"
explanation = "`v[5]` 는 panic 하지만 `v.get(5)` 는 `Option<&i32>` 를 돌려주므로 범위 밖이면 `None` 이 됩니다. 원소가 3개뿐이라 None 쪽이 실행됩니다."

[[quiz]]
prompt = "단어마다 처음 나오면 0 을 넣고, 나올 때마다 1 씩 더해 개수를 세세요"
code = '''
use std::collections::HashMap;

fn main() {
    let words = vec!["사과", "배", "사과", "사과"];
    let mut counts = HashMap::new();
    for w in words {
        let count = counts.___(w).___(0);
        *count += 1;
    }
    println!("사과: {}, 배: {}", counts["사과"], counts["배"]);
}
'''
answers = ["entry", "or_insert"]
hint = "키의 자리를 가져오는 메서드, 그리고 비어 있으면 기본값을 넣는 메서드"
explanation = "`entry(w).or_insert(0)` 은 키가 없으면 0 을 넣고, 있든 없든 그 값의 가변 참조를 돌려줍니다. `*count += 1` 로 역참조해 값을 늘리므로 `사과: 3, 배: 1` 이 출력됩니다."
