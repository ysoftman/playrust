title = "제네릭: 여러 타입에 쓰는 코드"
summary = "제네릭 함수 <T>, trait bound(T: PartialOrd), 제네릭 struct 와 impl<T>, impl Trait 매개변수"
concept = '''
제네릭(generic)은 구체적인 타입 대신 `T` 같은 타입 매개변수를 써서, 여러 타입에 똑같이 동작하는 코드를 한 번만 작성하는 방법입니다.

함수 이름 뒤 `<T>` 로 타입 매개변수를 선언합니다. 예를 들어 `fn largest<T: PartialOrd>(list: &[T]) -> &T` 는 어떤 타입의 슬라이스든 받아 가장 큰 원소의 참조를 돌려줍니다.

`T: PartialOrd` 처럼 타입 매개변수에 붙이는 조건을 trait bound 라고 합니다. 아무 타입이나 `>` 로 비교할 수는 없으므로, "비교 연산을 구현한 타입만 받겠다" 고 컴파일러에게 알려 주는 것입니다. 조건이 여러 개면 `T: Display + PartialOrd` 처럼 `+` 로 잇습니다.

구조체도 제네릭으로 만들 수 있습니다.
- `struct Point<T> { x: T, y: T }` 는 `Point<i32>`, `Point<f64>` 처럼 여러 타입으로 쓰입니다.
- 메서드는 `impl<T> Point<T> { ... }` 블록에 작성합니다. `impl` 뒤에도 `<T>` 를 적어야 T 가 타입 매개변수라는 뜻이 됩니다.

매개변수 타입 자리에 `impl Display` 라고 쓰면 "Display 트레이트를 구현한 아무 타입" 을 받는다는 뜻입니다. `fn show(item: impl Display)` 는 `fn show<T: Display>(item: T)` 를 짧게 쓴 것입니다.

제네릭 코드는 컴파일할 때 실제로 쓰인 타입마다 따로 만들어지므로(단형화), 실행 속도 손해가 없습니다.
'''
example = '''
use std::fmt::Display;

fn largest<T: PartialOrd>(list: &[T]) -> &T {
    let mut largest = &list[0];
    for item in list {
        if item > largest {
            largest = item;
        }
    }
    largest
}

struct Point<T> {
    x: T,
    y: T,
}

impl<T: Display> Point<T> {
    fn show(&self) {
        println!("({}, {})", self.x, self.y);
    }
}

fn print_twice(item: impl Display) {
    println!("{item} {item}");
}

fn main() {
    println!("가장 큰 수: {}", largest(&[3, 7, 2]));
    println!("가장 큰 문자: {}", largest(&['a', 'z', 'm']));

    let p1 = Point { x: 1, y: 2 };
    let p2 = Point { x: 1.5, y: 2.5 };
    p1.show();
    p2.show();

    print_twice("안녕");
    print_twice(42);
}
'''

[[quiz]]
prompt = "x, y 가 같은 타입 T 인 제네릭 구조체와, 그 메서드를 담는 impl 블록을 완성하세요"
code = '''
struct Point<___> {
    x: T,
    y: T,
}

impl<___> Point<T> {
    fn x(&self) -> &T {
        &self.x
    }
}

fn main() {
    let a = Point { x: 1, y: 2 };
    let b = Point { x: 1.5, y: 2.5 };
    println!("a = ({}, {}), b.x = {}", a.x(), a.y, b.x());
}
'''
answers = ["T", "T"]
hint = "필드 타입으로 이미 쓰이고 있는 타입 매개변수 이름(대문자 한 글자)"
explanation = "`struct Point<T>` 로 타입 매개변수를 선언하고, 메서드 블록도 `impl<T> Point<T>` 처럼 T 를 다시 선언합니다. 덕분에 `Point<i32>` 와 `Point<f64>` 를 같은 코드로 다룹니다."

[[quiz]]
prompt = "Display 트레이트를 가져오고, Display 를 구현한 아무 타입이나 받는 매개변수를 쓰세요"
code = '''
use std::fmt::___;

fn announce(item: ___ Display) {
    println!("공지: {item}");
}

fn main() {
    announce("점심시간입니다");
    announce(3);
}
'''
answers = ["Display", "impl"]
hint = "{} 출력을 담당하는 트레이트 이름, 그리고 '이 트레이트를 구현한 타입' 을 뜻하는 키워드"
explanation = "`item: impl Display` 는 Display 를 구현한 어떤 타입이든 받는다는 뜻으로, `<T: Display>(item: T)` 의 짧은 표기입니다. 그래서 문자열과 정수를 모두 넘길 수 있습니다."

[[quiz]]
prompt = "f64 와 char 모두에서 동작하도록, > 비교가 가능한 타입만 받는 trait bound 를 쓰세요"
code = '''
fn largest<T: ___>(list: &[T]) -> &T {
    let mut largest = &list[0];
    for item in list {
        if item > largest {
            largest = item;
        }
    }
    largest
}

fn main() {
    let temps = [21.5, 25.3, 19.8];
    println!("최고 기온: {}", largest(&temps));
    let chars = ['r', 'u', 's', 't'];
    println!("가장 뒤 문자: {}", largest(&chars));
}
'''
answers = ["PartialOrd"]
hint = "부분 순서 비교(partial ordering) 트레이트. f64 는 Ord 를 구현하지 않습니다"
explanation = "`>` 연산은 `PartialOrd` 트레이트가 제공합니다. f64 는 NaN 때문에 완전한 순서(`Ord`)가 없어서, f64 까지 받으려면 `T: PartialOrd` 를 써야 합니다."
