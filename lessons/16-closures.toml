title = "클로저와 이터레이터"
summary = "클로저 |x| x + 1, 환경 캡처, iter().map().filter().collect(), sum"
concept = '''
클로저(closure)는 이름 없이 만들어 변수에 담거나 다른 함수에 넘길 수 있는 작은 함수입니다. `let add_one = |x| x + 1;` 처럼 매개변수를 세로 막대 `|` 두 개 사이에 쓰고, 본문이 여러 줄이면 `{ }` 로 감쌉니다. 호출은 함수처럼 `add_one(5)` 로 합니다.

클로저의 매개변수와 반환 타입은 대부분 컴파일러가 추론하지만, `|x: i32| -> i32 { x + 1 }` 처럼 직접 적을 수도 있습니다.

함수와 달리 클로저는 자신이 만들어진 곳의 변수를 캡처(capture)해 쓸 수 있습니다. `let bonus = 10;` 다음에 `let add = |x| x + bonus;` 라고 쓰면, 클로저 안에서 바깥 변수 `bonus` 를 그대로 사용합니다.

클로저는 이터레이터와 함께 쓸 때 특히 빛납니다. `v.iter()` 는 벡터 원소의 참조를 하나씩 꺼내 주는 이터레이터를 만들고, 여기에 메서드를 이어 붙입니다.
- `map(|x| ...)`: 각 원소를 클로저가 돌려준 값으로 바꿉니다.
- `filter(|x| ...)`: 클로저가 `true` 를 돌려준 원소만 남깁니다. 클로저가 원소의 참조를 받으므로 `*x` 처럼 역참조가 필요할 때가 있습니다.
- `collect()`: 결과를 `Vec` 등으로 모읍니다. `let v: Vec<i32> = ...` 처럼 결과 타입을 알려 줘야 합니다.
- `sum()`: 모든 원소를 더합니다. 이것도 `let total: i32 = ...` 처럼 결과 타입이 필요합니다.

이터레이터는 게으르게(lazy) 동작해서, `collect` 나 `sum` 처럼 결과를 만드는 메서드를 호출해야 비로소 실제 계산이 일어납니다.
'''
example = '''
fn main() {
    let add_one = |x| x + 1;
    println!("add_one(5) = {}", add_one(5));

    let bonus = 10;
    let add_bonus = |x: i32| -> i32 { x + bonus };
    println!("add_bonus(5) = {}", add_bonus(5));

    let nums = vec![1, 2, 3, 4, 5];
    let doubled: Vec<i32> = nums.iter().map(|x| x * 2).collect();
    println!("두 배: {:?}", doubled);

    let big: Vec<i32> = nums.iter().map(|x| x * 10).filter(|x| *x > 20).collect();
    println!("20 보다 큰 값: {:?}", big);

    let total: i32 = nums.iter().sum();
    println!("합계: {total}");
}
'''

[[quiz]]
prompt = "x 를 받아 바깥 변수 bonus 를 더하는 클로저의 매개변수 구분 기호를 쓰세요"
code = '''
fn main() {
    let bonus = 10;
    let add_bonus = ___x: i32___ x + bonus;
    println!("{}", add_bonus(5));
}
'''
answers = ["|", "|"]
hint = "클로저 매개변수는 세로 막대 기호 두 개 사이에 씁니다"
explanation = "`|x: i32| x + bonus` 는 x 를 받아 x + bonus 를 돌려주는 클로저입니다. 클로저는 바깥 변수 bonus 를 캡처하므로 `15` 가 출력됩니다."

[[quiz]]
prompt = "각 원소를 두 배로 바꾼 뒤, 그 결과를 Vec 으로 모으세요"
code = '''
fn main() {
    let nums = vec![1, 2, 3];
    let doubled: Vec<i32> = nums.iter().___(|x| x * 2).___();
    println!("{:?}", doubled);
}
'''
answers = ["map", "collect"]
hint = "원소를 다른 값으로 변환하는 메서드, 그리고 이터레이터 결과를 컬렉션으로 모으는 메서드"
explanation = "`map` 은 각 원소에 클로저를 적용해 새 값을 만들고, `collect` 는 그 값들을 변수에 적힌 타입 `Vec<i32>` 로 모읍니다. 결과는 `[2, 4, 6]` 입니다."

[[quiz]]
prompt = "짝수만 남긴 뒤, 남은 값을 모두 더하세요"
code = '''
fn main() {
    let nums = vec![1, 2, 3, 4, 5, 6];
    let even_sum: i32 = nums.iter().___(|x| *x % 2 == 0).___();
    println!("짝수의 합: {even_sum}");
}
'''
answers = ["filter", "sum"]
hint = "조건에 맞는 원소만 거르는 메서드, 그리고 모든 원소를 더하는 메서드"
explanation = "`filter` 는 클로저가 true 를 돌려준 원소(2, 4, 6)만 남기고, `sum` 은 이를 모두 더해 `12` 를 만듭니다. filter 의 클로저는 원소의 참조를 받기 때문에 `*x` 로 한 번 역참조했습니다."
